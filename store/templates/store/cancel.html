{% extends 'store/base.html' %}

{% block title %}Payment Cancelled | Ecom{% endblock title %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 550px;">
        <i class="fa-solid fa-circle-xmark text-danger fs-1 mb-3"></i>
        <h2 class="fw-bold mb-2">Payment Cancelled</h2>
        <p class="text-muted mb-4">Your order was not charged. You can review your items in the cart and try paying again.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'cart' %}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">Return to Cart</a>
            <a href="{% url 'checkout' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Try Again</a>
        </div>
    </div>
</div>
{% endblock content %}

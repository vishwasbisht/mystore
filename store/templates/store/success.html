{% extends 'store/base.html' %}

{% block title %}Payment Successful | Ecom{% endblock title %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 550px;">
        <i class="fa-solid fa-circle-check text-success fs-1 mb-3"></i>
        <h2 class="fw-bold mb-2">Payment Successful!</h2>
        <p class="text-muted mb-4">Thank you for your purchase. Your order has been placed successfully and is now being processed.</p>
        <div>
            <a href="{% url 'store' %}" class="btn btn-primary rounded-pill px-4 fw-bold">Continue Shopping</a>
        </div>
    </div>
</div>
{% endblock content %}

{% extends 'store/base.html' %}

{% block title %}{{ product.name }} | Details{% endblock title %}

{% block content %}
<div class="container py-4">
    <a href="{% url 'store' %}" class="btn btn-outline-secondary rounded-pill px-4 mb-4">
        <i class="fa-solid fa-arrow-left me-2"></i>Back to Products
    </a>

    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="row g-4 align-items-center">
            <div class="col-md-6 text-center bg-light rounded-4 p-4">
                <img src="{{ product.imageurl }}" class="img-fluid object-fit-contain" style="max-height: 350px;" alt="{{ product.name }}">
            </div>

            <div class="col-md-6">
                <span class="badge bg-success-subtle text-success mb-2 px-3 py-2 rounded-pill">In Stock</span>
                <h2 class="fw-bold text-dark mb-2">{{ product.name }}</h2>
                <h3 class="fw-bold text-primary mb-3">${{ product.price }}</h3>
                <p class="text-muted mb-4">{{ product.description|default:"No description available." }}</p>

                <button data-product="{{ product.id }}" data-action="add" class="btn btn-primary btn-lg rounded-pill px-4 update-cart fw-bold">
                    <i class="fa-solid fa-cart-plus me-2"></i>Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
